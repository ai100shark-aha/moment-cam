services:
  - type: web
    name: moment-cam
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --timeout 90
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: moment-cam-db
          property: connectionString
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: moment-cam-db
