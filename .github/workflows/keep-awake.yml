# 서버 깨워 두기: Render 무료 서버는 15분 동안 요청이 없으면 잠듭니다.
# 낮 시간(한국 시각 06:00~22:59)에 10분마다 한 번씩 접속해서 잠들지 않게 합니다.
# - 무료 서버는 한 달에 750시간까지 쓸 수 있습니다. 이 설정은 하루 17시간(한 달 약 510시간)입니다.
# - 시간을 바꾸려면 아래 cron 의 시(hour) 부분을 고치세요. (UTC 기준: 한국 시각 - 9시간)
# - 멈추려면 GitHub 저장소 > Actions > keep-awake > "Disable workflow" 를 누르거나 이 파일을 지우세요.
# - GitHub은 60일 동안 저장소에 변경이 없으면 예약 실행을 멈춥니다. 그때는 Actions 화면에서 다시 켜세요.
name: keep-awake

on:
  schedule:
    - cron: "*/10 21-23,0-13 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 서버에 접속
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} / %{time_total}s\n" --max-time 120 \
            https://moment-cam.onrender.com/accounts/login/ || true
